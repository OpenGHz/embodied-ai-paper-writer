# task_gallery.example.yaml — config for tools/task_gallery_figure.py
#
# A per-task gallery (F4 task-definitions / F5 rollouts style): each row is one
# task showing its init image + per-operation screenshots. Copy to
# task_gallery.yaml next to your paper, edit, then:
#
#   python3 tools/task_gallery_figure.py --config task_gallery.yaml --workspace <paper-dir>
#
# All paths (rows[].dir, output.dir) are relative to --workspace (default: CWD).
# For galleries containing both simulation and real-robot tasks, start from
# task_gallery.sim_real.yaml, the preferred preset. This file documents general options.

output:
  name: task_gallery          # output basename
  dir: figures                     # output directory (under the workspace)
  formats: [pdf]                   # which formats to write (add png for a quick self-check)
  dpi: 300

style:
  font_size: 10                    # base font size; row label = +1 (bold), sub-caption = -1
  font_family: sans-serif          # sans-serif (paper-figure default) or serif
  # Preferred fonts in order; keep an always-present fallback last (DejaVu Sans/Serif
  # ship with matplotlib) so it still renders sans-serif if Arial/Helvetica aren't installed.
  font_names: ["Arial", "Helvetica", "DejaVu Sans"]
  label_color: "#000000"           # per-row task-label color
  label_format: "{task} ({group})" # how the row label reads; {task} and {group} are filled per row
  task_font_size: null             # null: font_size + 1; explicit point sizes may be fractional
  caption_font_size: null          # null: font_size - 1
  group_font_size: null            # null: font_size + 2
  group_label_format: "{group}"    # use "({letter}) {group}" for (a), (b), ...; {index} is 1-based
  caption_color: "#000000"
  panel_border_color: "#D7DCE1"
  panel_border_width: 0            # points; 0 hides image borders, 0.3 gives a fine outline

layout:
  group_columns: 1                 # 1: stacked task rows; 2+: groups side by side with headings
  group_gap: 0.35                  # gap between group blocks (inches in the figure canvas)
  group_title_h: 0.3               # group-label strip height (top or bottom)
  group_title_position: top        # top: heading; bottom: centered subfigure caption
  task_label_position: left        # left: label column; top: horizontal title above the frames
  task_label_h: 0.24               # title-strip height when task_label_position is top
  row_gap: 0                       # extra vertical space between complete task rows
  # Groups follow first appearance in rows, wrap after group_columns, and align
  # task rows at the top even when group sizes differ. Panel sizes stay uniform.
  # Check font readability at the final LaTeX inclusion width after adding columns.
  panel_h: 1.55                    # inches per panel (image area)
  caption_h: 0.18                  # inches reserved for the sub-caption text
  label_w: 1.15                    # label-column width; unused when task_label_position is top
  panel_w: 1.85                    # inches per image column
  hspace: 0.05                     # vertical gap between grid rows
  wspace: 0.08                     # horizontal gap between panels
  square_crop: true                # center-crop each image to a square (uniform aspect ratio)
  # Fractional trim per side (0..1), applied AFTER square_crop so panels stay a
  # uniform aspect. {top: 0.2} drops the top 20% of every panel; lower panel_h
  # alongside it so the row shrinks instead of leaving whitespace. A row can
  # override this with its own `crop:` (see rows[] below).
  crop: {top: 0.0, bottom: 0.0, left: 0.0, right: 0.0}

captions:                          # how a filename becomes a panel sub-caption
  separator: ""                   # optional text between adjacent captions, e.g. "→"
  init_aliases: [init, 0_init]     # stems treated as the "init" panel (also any "*_init")
  strip_numeric_prefix: true       # "0_unlock" -> "unlock"; "_"/"-" become spaces
  rename:                          # explicit label fixes (matched case-insensitively)
    "open the door": "pull door"
    init: initial state            # renaming also applies to all recognized init aliases

image_extensions: [.png, .jpg, .jpeg]

# One entry per task row, in display order. Within a row, panels are ordered
# init-first, then by the numeric filename prefix (e.g. 1_*, 2_*, ...).
rows:
  - group: sim                     # {group} in labels; group heading when group_columns > 1
    task: safe                     # {task} in label_format
    dir: raw_data/sim/images/safe  # folder of screenshots for this task
  - group: sim
    task: lamp
    dir: raw_data/sim/images/lamp
  - group: sim
    task: door
    dir: raw_data/sim/images/door
  - group: real
    task: bottle
    dir: raw_data/real/images/bottle
  - group: real
    task: cabinet
    dir: raw_data/real/images/cabinet
    exclude: ["*_fail.png"]        # drop failure frames (those belong in an F8 figure)
