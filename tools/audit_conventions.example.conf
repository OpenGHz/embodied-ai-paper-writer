# audit_conventions.example.conf
# ============================================================================
# Example config for tools/audit_conventions.sh — per-paper customization.
#
# Copy to <your-paper-dir>/audit_conventions.conf and edit. The auditor
# auto-loads `audit_conventions.conf` from the paper directory if present;
# or pass an explicit path via `--config FILE`.
#
# Bash-sourced. Use Bash array syntax for list values.
# ============================================================================

# ----------------------------------------------------------------------------
# R02 — system-name spelling drift
# ----------------------------------------------------------------------------
# List old names the system was previously called. The auditor flags any
# occurrence as a sign of incomplete rename.
#
# Example: paper renamed "Closed-Loop Evidence Compilation" → "Closed-Loop
# Trace Compilation" mid-draft. List the OLD name(s) here.
RULE_02_OLD_NAMES=(
  # "Closed-Loop Evidence Compilation"
  # "Old System Name v2"
)

# ----------------------------------------------------------------------------
# R18 — paired condition labels: orphan use of OLD names
# ----------------------------------------------------------------------------
# After locking a canonical pair (e.g., `Distilled-Prompt VLM` vs.
# `Naked-Modality VLM`), list the OLD labels that should no longer appear.
# Hits indicate incomplete relabeling.
RULE_18_OLD_LABELS=(
  # "iteration row"
  # "iteration condition"
  # "no-prompt baseline"
  # "naked-modality baseline"
  # "naked-modality no-prompt"
)

# ----------------------------------------------------------------------------
# R20 — load-bearing scope-tag modifier outside its definition site
# ----------------------------------------------------------------------------
# Pick the ONE modifier that should be defined once and dropped elsewhere
# (e.g., `successful` in a paper that introduces "successful exploratory
# trace"). Also point to the file containing the canonical definition site
# (typically Problem Setup / §3.1). The auditor flags every occurrence of
# the modifier OUTSIDE that file.
#
# To audit multiple modifiers, re-run the tool with different config files.
RULE_20_MODIFIER=""              # e.g., "successful"
RULE_20_DEFINITION_FILE=""       # e.g., "sections/3_method.tex"

# ----------------------------------------------------------------------------
# Extra patterns for R19 — writing-process archaeology
# ----------------------------------------------------------------------------
# The universal R19 sweep already covers `Within-run`, `Phase N`, `Attempt
# 0NN`, `E0N`, "originally we used", "the most conservative of the
# candidates", "we initially considered", "in our first attempt".
#
# Add project-specific archaeology terms here (e.g., internal codenames or
# rejected baseline names that appeared in earlier drafts).
EXTRA_R19_PATTERNS=(
  # "BaselineCandidateX"
  # "internal-codename-7"
)

# ----------------------------------------------------------------------------
# Project-specific vocabulary locks (vocab-lock sweep)
# ----------------------------------------------------------------------------
# Patterns the auditor should flag everywhere they appear. The sweep is
# "manually verify": every hit is listed for human review (some may be
# legitimate, e.g., a source statement or an external citation that uses
# the locked term in context).
#
# Examples:
# - Lock to `trace` (the framework noun); flag `demo` / `demos` / `demo data`
#   so reviewer can confirm each remaining occurrence is a legitimate
#   data-source statement (e.g., in Experiments / Appendix dataset section).
# - Lock to `policy` over `controller`; flag `controller` everywhere.
# - Lock to a paper-specific term renamed mid-draft.
VOCAB_LOCK_PATTERNS=(
  # '\bdemo\b'
  # '\bdemos\b'
  # 'demo data'
  # '\bcontroller\b'
)
